<div id="add-experience-modal" class="project-form-modal" popover="auto" role="dialog" aria-labelledby="add-experience-modal-title">
    <button type="button" class="project-form-modal__backdrop" popovertarget="add-experience-modal" popovertargetaction="hide" aria-label="Close add experience form" tabindex="-1"></button>
    <div class="project-form-modal__content">
        <button type="button" class="project-form-modal__close" popovertarget="add-experience-modal" popovertargetaction="hide" aria-label="Close add experience form">×</button>
        <h2 id="add-experience-modal-title">Add an experience</h2>
        <form id="experience-form" method="post" action="{% url 'main:create_experience' %}" data-ajax-url="{% url 'api:experience-list' %}" class="project-form">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-field">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <p class="form-error">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}
            <div class="project-form-modal__actions">
                <button type="button" class="button button-secondary" popovertarget="add-experience-modal" popovertargetaction="hide">Cancel</button>
                <button type="submit" class="button">Save experience</button>
            </div>
        </form>
    </div>
</div>
