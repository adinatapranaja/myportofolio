<button
    type="button"
    class="button button-danger button-small"
    popovertarget="delete-experience-{{ experience.id }}"
    aria-label="Delete {{ experience.title }}"
>
    Delete
</button>
<div
    id="delete-experience-{{ experience.id }}"
    class="project-delete-modal"
    popover="auto"
    role="dialog"
    aria-modal="true"
    aria-labelledby="delete-experience-title-{{ experience.id }}"
>
    <button
        type="button"
        class="project-delete-modal__backdrop"
        popovertarget="delete-experience-{{ experience.id }}"
        popovertargetaction="hide"
        aria-label="Close delete confirmation"
    ></button>
    <div class="project-delete-modal__content">
        <button
            type="button"
            class="project-delete-modal__close"
            popovertarget="delete-experience-{{ experience.id }}"
            popovertargetaction="hide"
            aria-label="Close"
        >×</button>
        <h2 id="delete-experience-title-{{ experience.id }}">Delete experience?</h2>
        <p>Are you sure you want to delete <strong>{{ experience.title }}</strong>?</p>
        <div class="project-delete-modal__actions">
            <button
                type="button"
                class="button button-secondary"
                popovertarget="delete-experience-{{ experience.id }}"
                popovertargetaction="hide"
            >Cancel</button>
            <form method="post" action="{% url 'main:delete_experience' experience.id %}">
                {% csrf_token %}
                <button class="button button-danger" type="submit">Yes, delete</button>
            </form>
        </div>
    </div>
</div>
