<div id="add-project-modal" class="project-form-modal" popover="auto" role="dialog" aria-labelledby="add-project-modal-title">
    <button type="button" class="project-form-modal__backdrop" popovertarget="add-project-modal" popovertargetaction="hide" aria-label="Close add project form" tabindex="-1"></button>
    <div class="project-form-modal__content">
        <button type="button" class="project-form-modal__close" popovertarget="add-project-modal" popovertargetaction="hide" aria-label="Close add project form">×</button>
        <h2 id="add-project-modal-title">Add a project</h2>
        <form id="project-form" method="post" action="{% url 'main:create_project' %}" data-ajax-url="{% url 'main:create_project_ajax' %}" class="project-form">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-field">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <p class="form-error">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}
            <div class="project-form-modal__actions">
                <button type="button" class="button button-secondary" popovertarget="add-project-modal" popovertargetaction="hide">Cancel</button>
                <button type="submit" class="button">Save project</button>
            </div>
        </form>
    </div>
</div>
